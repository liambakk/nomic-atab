name: A case to look at
description: Let Liam know a case is ready and flag anything missing.
title: "Review case: "
body:
  - type: input
    id: case_reference
    attributes:
      label: Case reference
      description: Use the name or reference from the case notes.
    validations:
      required: true
  - type: input
    id: case_location
    attributes:
      label: Case notes location
      description: Where can Liam find the notes? Keep client details in the private folder.
    validations:
      required: false
  - type: textarea
    id: available
    attributes:
      label: What is available?
      description: A short outline is enough. Keep client details in the private folder.
    validations:
      required: true
  - type: textarea
    id: gaps
    attributes:
      label: Gaps or questions
      description: Anything missing or unclear that Liam should know?
    validations:
      required: false
  - type: input
    id: reviewer
    attributes:
      label: Who can explain the case?
      description: Name the person or role if known.
    validations:
      required: false
  - type: textarea
    id: permission
    attributes:
      label: Sharing notes for Liam
      description: Flag anything that cannot be shared or still needs checking. Keep the details in the private folder.
    validations:
      required: false
