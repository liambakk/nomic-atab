name: Case ready for review
description: Point Liam to a completed case and identify the remaining gaps.
title: "Review case: "
body:
  - type: input
    id: case_reference
    attributes:
      label: Case reference
      description: Use the reference from the case notes and manifest.
    validations:
      required: true
  - type: input
    id: case_location
    attributes:
      label: Case notes location
      description: Repository path or access-controlled private folder location, without credentials.
    validations:
      required: true
  - type: textarea
    id: available
    attributes:
      label: What is available?
      description: Summarise the case and source file references. Keep confidential details in the approved source location.
    validations:
      required: true
  - type: textarea
    id: gaps
    attributes:
      label: Gaps or questions
      description: Include missing history, unclear rules, outcome questions or permission limits. State none known if appropriate.
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Business reviewer
      description: Who can explain the case and assess the outcome? State not yet identified if unknown.
    validations:
      required: true
  - type: textarea
    id: permission
    attributes:
      label: Permission for this review
      description: Reference the permission record and limits. Leave pending if it has not been confirmed.
    validations:
      required: true
