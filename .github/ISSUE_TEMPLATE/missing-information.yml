name: Question or missing information
description: Flag something missing or a question for the team.
title: "Question: "
body:
  - type: input
    id: reference
    attributes:
      label: Company, workflow or case reference
      description: Identify which part of the handoff this affects.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What is missing or unclear?
      description: Explain the question and what it prevents us from understanding.
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: What kind of gap is it?
      options:
        - Needs explanation
        - Not recorded
        - Needs collecting
        - Permission pending
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Anything that would help explain it?
      description: Use references suitable for the repository's readers. Keep client records and sensitive details in the private handoff folder.
  - type: input
    id: contact
    attributes:
      label: Who could help?
      description: Name a person or role if known.
  - type: input
    id: timing
    attributes:
      label: Any timing to keep in mind?
      description: Leave blank if there is nothing specific.
